proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=osm_cache:10m max_size=500m inactive=30d use_temp_path=off;

# HTTP por IP: se mantiene para la app Flutter actual
server {
    listen 80;
    server_name 143.244.163.81;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/static/;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /tiles/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "GeoIncidenciasLoja-Tesis/1.0 (contacto: gonzalezandresvicentecano@gmail.com)";
        proxy_cache osm_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP por dominio: solo reto de Certbot y redirección a HTTPS
server {
    listen 80;
    server_name geoincidencias.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS por dominio: lo que consume Vercel
server {
    listen 443 ssl;
    http2 on;
    server_name geoincidencias.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/geoincidencias.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoincidencias.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/static/;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /tiles/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "GeoIncidenciasLoja-Tesis/1.0 (contacto: gonzalezandresvicentecano@gmail.com)";
        proxy_cache osm_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}