<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo | GeoIncidencias Loja</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; }
    header {
      background: #00796B; color: #fff; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    header h1 { font-size: 1.2rem; }
    select { padding: 6px 10px; border-radius: 6px; border: none; }
    #map { height: calc(100vh - 60px); }
    .popup-foto { width: 220px; border-radius: 8px; margin-bottom: 6px; }
    .estado-badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      color: #fff; font-size: 0.75rem; font-weight: bold;
    }
    .leyenda {
      background: #fff; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 0.8rem; line-height: 1.6;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>🗺️ Panel Administrativo — GeoIncidencias Loja</h1>
    <div>
      <label for="filtroCategoria">Filtrar:</label>
      <select id="filtroCategoria">
        <option value="todas">Todas las categorías</option>
      </select>
    </div>
  </header>

  <div id="map"></div>

  <script>
    // ===== Mapa centrado en Loja =====
    const map = L.map('map').setView([-4.0085, -79.2239], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO',
      subdomains: 'abc',
      maxZoom: 20
    }).addTo(map);

    // ===== Leyenda de estados =====
    const leyenda = L.control({ position: 'bottomright' });
    leyenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'leyenda');
      div.innerHTML = `
        <strong>Estado</strong><br>
        <span class="dot" style="background:red"></span>Recibido<br>
        <span class="dot" style="background:orange"></span>En proceso<br>
        <span class="dot" style="background:green"></span>Solucionado`;
      return div;
    };
    leyenda.addTo(map);

    let datosCompletos = null;
    let capaGeoJSON = null;

    function colorEstado(estado) {
      const e = (estado || '').toLowerCase();
      if (e.includes('solucion')) return 'green';
      if (e.includes('proceso')) return 'orange';
      return 'red';
    }

    function pintarMapa(data) {
      if (capaGeoJSON) map.removeLayer(capaGeoJSON);
      capaGeoJSON = L.geoJSON(data, {
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
          radius: 9, color: '#fff', weight: 2,
          fillColor: colorEstado(feature.properties.estado), fillOpacity: 0.9
        }),
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          let html = `
            <strong>${p.categoria || 'Sin categoría'}</strong><br>
            <span class="estado-badge" style="background:${colorEstado(p.estado)}">
              ${p.estado || 'Recibido'}
            </span>
            <p style="margin:6px 0">${p.descripcion || 'Sin descripción'}</p>
            <small>📅 ${p.fecha_reporte ? String(p.fecha_reporte).substring(0, 10) : '—'}</small>`;
          if (p.foto_url) {
            html = `<img class="popup-foto" src="${p.foto_url}">` + html;
            }
          layer.bindPopup(html);
        }
      }).addTo(map);
    }

    // ===== Cargar GeoJSON desde tu backend Django =====
    fetch('/api/incidencias-geojson/')
      .then(res => res.json())
      .then(data => {
        datosCompletos = data;
        // Llenar selector de categorías dinámicamente
        const cats = [...new Set(data.features.map(f => f.properties.categoria))];
        const select = document.getElementById('filtroCategoria');
        cats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat; opt.textContent = cat;
          select.appendChild(opt);
        });
        pintarMapa(data);
      })
      .catch(err => console.error('Error cargando GeoJSON:', err));

    // ===== Filtro por categoría (RF009) =====
    document.getElementById('filtroCategoria').addEventListener('change', e => {
      if (!datosCompletos) return;
      const valor = e.target.value;
      valor === 'todas'
        ? pintarMapa(datosCompletos)
        : pintarMapa({
            ...datosCompletos,
            features: datosCompletos.features.filter(f => f.properties.categoria === valor)
          });
    });
  </script>
</body>
</html>
